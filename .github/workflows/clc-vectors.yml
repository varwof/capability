name: clc-vectors

# 向量仓自身的最小校验：JSON 可解析、schema 校验通过、条数与附录声明一致。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install --quiet jsonschema

      - name: Bilingual reference docs are in step (audit C-1)
        run: python3 scripts/check-bilingual.py

      - name: "New corpora: counts, shapes and declaration schema (audit C-2)"
        run: |
          python3 - <<'PY'
          import json, jsonschema, sys
          base = 'data/_vectors/clc-v1/'
          problems = []
          def load(name):
              with open(base + name, encoding='utf-8') as f:
                  return json.load(f)
          def check_list(name, want, required):
              data = load(name)
              if len(data) != want:
                  problems.append(f'{name}: {len(data)} entries, expected {want}')
              for e in data:
                  for k in required:
                      if k not in e:
                          problems.append(f'{name}: {e.get("id", "?")} lacks {k}')
              return data
          check_list('symmetry-vectors.json', 50, ['id', 'kind', 'expect'])
          check_list('quantity-vectors.json', 8, ['id', 'kind', 'capability', 'expect'])
          check_list('string-domain-vectors.json', 24, ['id', 'domain', 'param', 'grant', 'op', 'expect'])
          sdecl = check_list('scheme-declaration-vectors.json', 9, ['id', 'expect', 'declaration'])
          pd = load('profile-declarations.json')
          if pd.get('schema') != 'clc-profile-declarations-v1':
              problems.append('profile-declarations.json: schema mismatch')
          declared = [d.get('profile') for d in pd.get('declarations', [])]
          if len(declared) != len(set(declared)):
              problems.append('profile-declarations.json: duplicate declaration')
          used = set()
          for rel in ('crosswalk-vectors.json',
                      '../clc-d/containment-crosswalk-vectors.json',
                      '../clc-d/authorize-crosswalk-vectors.json'):
              for e in json.load(open(base + rel, encoding='utf-8')):
                  if e.get('profile'):
                      used.add(e['profile'])
          for missing in sorted(used - set(declared)):
              problems.append(f'profile-declarations.json: no declaration for {missing}')
          for orphan in sorted(set(declared) - used):
              problems.append(f'profile-declarations.json: declaration for unused profile {orphan}')
          schema = load('scheme-declaration.schema.json')
          schema['required'] = [r for r in schema.get('required', []) if r != 'digest']
          for c in sdecl:
              if c['expect'] == 'accept':
                  try:
                      jsonschema.validate(c['declaration'], schema)
                  except jsonschema.ValidationError as e:
                      problems.append(f"{c['id']}: {e.message[:60]}")
          if problems:
              print('new corpora check FAILED')
              for p in problems:
                  print('  ' + p)
              sys.exit(1)
          print(f'new corpora check OK: 50/8/24/9 + {len(declared)} declarations')
          PY

      - name: Validate the authorize cross-walk corpus against its schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-d/authorize-crosswalk-vectors.json"))
          s = json.load(open("data/_vectors/clc-d/authorize-crosswalk-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} authorize cross-walk vectors")
          PY

      - name: Validate extension canonical parity fixture
        run: python3 scripts/check-extension-parity.py

      - name: Validate vectors against schema, and against the documented count
        run: |
          python3 - <<'PY'
          import json, jsonschema, re, sys
          base = "data/_vectors/clc-v1"
          vectors = json.load(open(f"{base}/vectors.json"))
          schema = json.load(open(f"{base}/vectors.schema.json"))
          vs = vectors["vectors"] if isinstance(vectors, dict) and "vectors" in vectors else vectors
          jsonschema.validate(vs, schema)
          print(f"schema OK, {len(vs)} vectors")

          # The comment in this file claims the count matches the documented
          # count, so actually check it: the normative spec states the corpus
          # size in its appendix, and the READMEs state it too.
          spec = open("docs/capability-language-core-v1.md").read()
          m = re.search(r"\*\*Total: (\d+) vectors\*\*", spec)
          if not m:
              sys.exit("spec appendix does not state '**Total: N vectors**'")
          claimed = int(m.group(1))
          if len(vs) != claimed:
              sys.exit(f"corpus has {len(vs)} vectors but the spec appendix claims {claimed}")
          for path in ("README.md", "README_CN.md", "data/_vectors/clc-v1/README.md"):
              text = open(path).read()
              for pat in (r"\*\*(\d+) conformance vectors\*\*", r"\*\*(\d+) 条一致性向量\*\*", r"\*\*(\d+)\*\* vectors"):
                  mm = re.search(pat, text)
                  if mm and int(mm.group(1)) != len(vs):
                      sys.exit(f"{path} claims {mm.group(1)} vectors, corpus has {len(vs)}")
          print(f"documented count matches: {claimed}")
          PY

      - name: Property cases are reproducible
        run: |
          python3 scripts/gen-property-cases.py --out /tmp/property-cases.json
          diff -u data/_vectors/clc-v1/property-cases.json /tmp/property-cases.json \
            || (echo "property-cases.json is stale: re-run scripts/gen-property-cases.py"; exit 1)

      - name: Validate the §6.5 param-bound vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-v1/param-bounds-vectors.json"))
          s = json.load(open("data/_vectors/clc-v1/param-bounds-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} param-bound vectors")
          PY

      - name: Validate the §8.5 Resolve vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-v1/resolve-vectors.json"))
          s = json.load(open("data/_vectors/clc-v1/resolve-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} Resolve vectors")
          PY

      - name: Validate the §13.11 AuthorizeWithChain vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-d/authorize-chain-vectors.json"))
          s = json.load(open("data/_vectors/clc-d/authorize-chain-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} AuthorizeWithChain vectors")
          PY

      - name: Validate the CLC-D containment vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-d/containment-vectors.json"))
          s = json.load(open("data/_vectors/clc-d/containment-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} containment vectors")
          PY

      - name: Validate the CLC-D containment cross-walk vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-d/containment-crosswalk-vectors.json"))
          s = json.load(open("data/_vectors/clc-d/containment-crosswalk-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} cross-walk vectors")
          PY

      - name: Validate the §13.5 reason-collapse policy vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-d/reason-collapse-vectors.json"))
          s = json.load(open("data/_vectors/clc-d/reason-collapse-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} reason-collapse vectors")
          PY

      - name: Validate the §13.4.5 profile-owned mode-lattice vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-d/profile-owned/aic-jwt-da-mode-lattice-vectors.json"))
          s = json.load(open("data/_vectors/clc-d/profile-owned/aic-jwt-da-mode-lattice-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} mode-lattice vectors")
          PY

      - name: Validate the §7.1 ConstraintUnion vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-v1/constraint-union-vectors.json"))
          s = json.load(open("data/_vectors/clc-v1/constraint-union-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} ConstraintUnion vectors")
          PY

      - name: Validate the §6.6 BoundMeet vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-v1/param-bounds-meet-vectors.json"))
          s = json.load(open("data/_vectors/clc-v1/param-bounds-meet-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} BoundMeet vectors")
          PY

      - name: Validate the §6.5 type-sensitive-equality vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-v1/param-bounds-equality-vectors.json"))
          s = json.load(open("data/_vectors/clc-v1/param-bounds-equality-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} param-bounds-equality vectors")
          PY

      - name: Validate the §7.1 ConstraintUnion collation vectors against their schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          v = json.load(open("data/_vectors/clc-v1/constraint-union-collation-vectors.json"))
          s = json.load(open("data/_vectors/clc-v1/constraint-union-collation-vectors.schema.json"))
          jsonschema.validate(v, s)
          print(f"schema OK, {len(v)} ConstraintUnion collation vectors")
          PY

      - name: BoundMeet property cases are reproducible
        run: |
          python3 scripts/gen-param-bounds-meet-property-cases.py --out /tmp/param-bounds-meet-property-cases.json
          diff -u data/_vectors/clc-v1/param-bounds-meet-property-cases.json /tmp/param-bounds-meet-property-cases.json \
            || (echo "param-bounds-meet-property-cases.json is stale: re-run scripts/gen-param-bounds-meet-property-cases.py"; exit 1)

      - name: OCMP offline vectors (coverage + vocabulary)
        run: python3 scripts/check-offline-vectors.py

      - name: Projection case manifest matches checked-in outputs
        run: python3 tools/check_projection_cases.py

      - uses: actions/checkout@v4
        with:
          repository: varwof/register
          path: register
          ref: 1ee8efb24c50d247f805fa712a9e8edd51339245

      - uses: actions/checkout@v4
        with:
          repository: varwof/aic-capability-demo
          path: aic-capability-demo
          ref: 533641638ac3dd6c8a0bbb797d0eb3bd9c337431

      - name: Projection probes reproduce from pinned source files
        run: python3 tools/check_projection_cases.py --register-dir register

      # contrib/ 的门：同一管治下的两个探针必须对匹配输入跑出**逐字节相同**的输出。
      # 门是"两实现一致"，不是与提交时的 out-*.txt 逐字节比——实现升版时
      # 打印的 CLC_REVISION 行会变，而判定与 reason 应当不变。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Contributed probes agree across implementations
        run: |
          set -e
          export CLC_PY_DIR="$PWD/aic-capability-demo"
          export CLC_TS_FILE="file://$PWD/aic-capability-demo/ts/clc_semantics.ts"
          for d in contrib/clc-unit-encoding contrib/iicp-touchpoint; do
            python3 "$d/probe.py" > /tmp/probe-py.txt
            node --disable-warning=ExperimentalWarning --experimental-strip-types "$d/probe.mjs" > /tmp/probe-ts.txt
            cmp /tmp/probe-py.txt /tmp/probe-ts.txt
            echo "contrib probe agree: $d"
          done

      - name: Projection binding cases agree across implementations
        run: |
          python3 tools/check_projection_cases.py \
            --register-dir register \
            --demo-dir aic-capability-demo

      - uses: actions/setup-go@v5
        with:
          go-version-file: register/go.mod
          cache-dependency-path: register/go.sum

      - name: Install catalog probe dependency
        run: pip install --quiet cryptography

      - name: Prepare sibling register checkout for probe discovery
        run: cp -a register ../register

      - name: Scheme-admin and catalog corpora are reproducible
        env:
          REGISTER_DIR: ${{ github.workspace }}/../register
          CLC_PY_DIR: ${{ github.workspace }}/aic-capability-demo
          CLC_TS_DIR: ${{ github.workspace }}/aic-capability-demo/ts
        run: |
          python3 scripts/gen-scheme-admin-vectors.py --check
          python3 scripts/gen-catalog-vectors.py --check
          python3 tools/check_catalog_cases.py
          python3 contrib/scheme-admin/run.py --check
