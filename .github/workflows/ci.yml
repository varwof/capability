name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The registry check verifies corpus hashes at the commit each claim
          # names, which needs the history rather than a depth-1 clone.
          fetch-depth: 0

      - name: Conformance registry (rows, notes, pins)
        run: python3 scripts/check-registry.py

      - name: Conformance registry checker (self-test)
        run: python3 scripts/test_check_registry.py

      - name: Validate JSON files
        run: |
          set -e
          find data -name '*.json' | while read -r f; do
            jq -e . "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
          echo "all JSON files valid"

      - name: Verify scheme structure
        run: |
          set -e
          for f in $(find data -not -path '*/_*/*' -name 'v[0-9]*.json'); do
            scheme_id=$(jq -r '.scheme_id // empty' "$f")
            if [ -z "$scheme_id" ]; then
              echo "missing scheme_id: $f"
              exit 1
            fi
            echo "  $f -> $scheme_id"
          done
